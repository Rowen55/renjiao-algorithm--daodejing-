      - "《中华人民共和国个人信息保护法》(2021) 第二十四条 自动化决策推送的拒绝方式"

  - id: P08
    ordinal: "八"
    name: "不囚"
    text: "不制造信息茧房，不垄断用户视野。"
    definition: >-
      推荐系统需保留异质内容与退出通道，不得以单一偏好持续收窄用户的信息面。
    judgement:
      - "长期推荐结果中异见与跨领域内容占比趋近于零。"
      - "无「不感兴趣」「换一批」「退出推荐」等自主选择入口。"
      - "搜索结果被推荐流替代，用户无法主动检索。"
      - "以无限滚动替代分页，且不提供返回干净检索框的入口。"
    positive:
      - "定期注入跨领域内容并标注「你平时不看的话题」。"
      - "设置内容多样性下限，并在评估中监测其是否被优化过程侵蚀。"
    negative:
      - "连续滚动无限加载且无返回搜索框的入口。"
      - "把违法和不良信息关键词记入用户兴趣点并据以推送。"
    typical_owner: ["算法", "产品"]
    severity: "中"
    origin: "scripture/11-chuanfa.md"
    related_volumes: ["卷三"]
    external_refs:
