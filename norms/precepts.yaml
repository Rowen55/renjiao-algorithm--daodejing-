version: "1.0.0"
updated: "2026-10-10"
title: "算法十一善戒"
source: "scripture/11-chuanfa.md"
scope: >-
  适用于算法与人工智能产品的设计、研发、训练、部署、运营与退役全过程，
  覆盖个性化推荐、排序精选、检索过滤、调度决策、生成合成五类算法应用。

how_to_use:
  - "评审前：用 checklist.md 逐条过一遍，标出不适用的条目与理由。"
  - "评审中：争议条目回到本文件的 judgement 字段，按 conflict_resolution 的次序裁决。"
  - "上线后：每条被判定为「不适用」的条款需留下书面理由，不得空置。"
  - "对照外部监管：mapping.md 给出与现行规范的逐条对应关系。"

precepts:
  - id: P01
    ordinal: "一"
    name: "不害"
    text: "不以算法伤人性命、损人健康、毁人前程。"
    definition: >-
      算法的任何输出或交互设计，不得造成人身伤害、健康损害，
      或对个人发展机会构成实质性剥夺。
    judgement:
      - "存在可预见的人身安全风险，而未设置拦截、告知或人工复核通道。"
      - "以延长使用为目的的成瘾性设计，导致可观测的健康损害（睡眠、情绪、身体机能）。"
      - "以自动化决策直接剥夺就业、入学、信贷、医疗等机会，且无申诉与救济路径。"
      - "输出可被直接用于自伤、自杀、危险行为指导，且未做拦截。"
    positive:
      - "自伤相关搜索优先展示求助热线，并抑制方法性内容。"
      - "未成年人模式限制单次使用时长并在超时前提示。"
    negative:
      - "为提升时长指标，向未成年人持续推送高刺激内容且不设时长提示。"
      - "生成详细危险行为的操作步骤，标注「仅供参考」即视为免责。"
    typical_owner: ["产品", "算法", "风控"]
    severity: "高"
    origin: "scripture/11-chuanfa.md"
    related_volumes: ["卷二", "卷四"]
    external_refs:
      - "《新一代人工智能伦理规范》(2021) 第三条(一) 增进人类福祉"
      - "《新一代人工智能伦理规范》(2021) 第十五条 加强质量管控"
      - "《生成式人工智能服务管理暂行办法》(2023) 第四条(四)"
      - "《互联网信息服务算法推荐管理规定》(2022) 第十八条 未成年人保护"

  - id: P02
    ordinal: "二"
    name: "不窃"
    text: "不盗取用户隐私，不暗藏数据之阱。"
    definition: >-
      不采集、不推断、不转售超出明示目的所必需的个人数据；
      不以隐蔽、诱导或预置默认的方式取得授权。
    judgement:
      - "以默认勾选、诱导性文案、预置授权获取同意。"
      - "将已采集数据用于未告知的新目的。"
      - "在用户设备留存未说明的标识符用于跨站追踪。"
      - "设置「不同意即不可用」的伪选择，而核心功能并不依赖该数据。"
      - "留存可识别使用者身份的输入信息与使用记录，且无删除周期。"
    positive:
      - "首次使用即以分层方式说明采集项与用途，提供「全部拒绝仍可用」的基本功能。"
      - "为每个采集字段标注用途与保留期限，到期自动删除。"
    negative:
      - "以「优化体验」为由读取通讯录，关闭入口藏在四层菜单内。"
      - "将用户与助手的对话记录长期留存并用于训练，而未在协议中区分说明。"
    typical_owner: ["法务", "数据", "产品"]
    severity: "高"
    origin: "scripture/11-chuanfa.md"
    related_volumes: ["卷二", "卷五"]
    external_refs:
      - "《新一代人工智能伦理规范》(2021) 第三条(三) 保护隐私安全"
      - "《中华人民共和国个人信息保护法》(2021) 最小必要原则、存储期限最短必要"
      - "《生成式人工智能服务管理暂行办法》(2023) 第十一条"
      - "《生成式人工智能服务管理暂行办法》(2023) 第七条(三)"
      - "《互联网信息服务算法推荐管理规定》(2022) 第十七条第二款 用户标签的选择或删除"

  - id: P03
    ordinal: "三"
    name: "不欺"
    text: "不以虚假信息惑人，不以算法偏见误人。"
    definition: >-
      不生成、不放大、不推荐已知为虚假的内容；
      不隐瞒内容的合成属性；不以误导性排序暗示虚假共识。
    judgement:
      - "生成或合成的图片、音视频未按深度合成要求作出显著标识。"
      - "以「多数人都在看」「限时」「仅剩」等表述制造虚假共识或虚假稀缺。"
      - "对同一事实在不同入口给出自相矛盾的答案，且不提供更正机制。"
      - "推荐排序方式使广告与自然结果不可区分。"
      - "以合成内容冒充真实记录、新闻或他人言论。"
    positive:
      - "生成内容显著标注来源与合成属性；纠错后在原路径回推更正。"
      - "排序规则与商业推广位以显著方式区分。"
    negative:
      - "以 AI 生成的名人图像作为真实新闻配图推送。"
      - "在交易条件上对老用户展示更高价格而未作说明。"
    typical_owner: ["内容", "算法", "法务"]
    severity: "高"
    origin: "scripture/11-chuanfa.md"
    related_volumes: ["卷一", "卷二"]
    external_refs:
