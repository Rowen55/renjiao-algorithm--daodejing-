      - "《新一代人工智能伦理规范》(2021) 第十二条 增强安全透明"
      - "《新一代人工智能伦理规范》(2021) 第十六条 保障用户权益"
      - "《互联网信息服务算法推荐管理规定》(2022) 第十六条 告知与公示"
      - "《互联网信息服务算法推荐管理规定》(2022) 第十七条 不针对个人特征的选项或便捷关闭"
      - "《互联网信息服务算法推荐管理规定》(2022) 第十二条 透明度和可解释性"

  - id: P07
    ordinal: "七"
    name: "不扰"
    text: "不无故推送，不诱导点击，不制造焦虑。"
    definition: >-
      非用户主动请求时不触发通知；
      不以稀缺、倒计时、社交比较等手段制造紧迫感或焦虑。
    judgement:
      - "夜间时段发送非紧急推送，或未经用户明确同意发送营销推送。"
      - "以「限时优惠」「你的好友都在看」「你已落后」作为默认文案。"
      - "关闭推送的路径比开启推送更长或步骤更多。"
      - "以震动、红点、连续角标反复触达以召回休眠用户。"
    positive:
      - "默认关闭营销推送，需用户主动开启。"
      - "推送按重要性分级，仅紧急级别可突破免打扰时段。"
    negative:
      - "连续三天未活跃即触发三条以上召回推送并叠加优惠倒计时。"
    typical_owner: ["产品", "运营"]
    severity: "中"
    origin: "scripture/11-chuanfa.md"
    related_volumes: ["卷三"]
    external_refs:
