      - "《互联网信息服务算法推荐管理规定》(2022) 第十一条 人工干预与用户自主选择机制"
      - "《互联网信息服务算法推荐管理规定》(2022) 第十二条 内容去重、打散干预"

  - id: P09
    ordinal: "九"
    name: "不贪"
    text: "不滥采数据，不超用算力，不囤积资源。"
    definition: >-
      数据按最小必要采集；算力按时段调度；不囤积已收敛的数据与闲置资源。
    judgement:
      - "采集项无法对应到任何具体功能。"
      - "重复执行已知无效的训练或评测任务。"
      - "长期保有过期数据，不设删除周期。"
      - "以「以后可能有用」为由全量留存日志，且无使用记录。"
    positive:
      - "为每个采集字段标注用途与保留期限，到期自动删除。"
      - "训练任务错峰调度，闲置资源释放或共享。"
      - "能蒸馏则蒸馏，能复用则复用，不重复训练功能重叠的模型。"
    negative:
      - "在无明确目的的情况下全量留存用户行为日志且不设删除计划。"
    typical_owner: ["数据", "基础设施", "算法"]
    severity: "中"
    origin: "scripture/11-chuanfa.md"
    related_volumes: ["卷二", "卷五", "卷六"]
