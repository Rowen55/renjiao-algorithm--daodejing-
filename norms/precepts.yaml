      - "《生成式人工智能服务管理暂行办法》(2023) 第四条(三)"

  - id: P11
    ordinal: "十一"
    name: "不名"
    text: "不冒人之名，不窃创之属，不伪托灵明，不占未予之署。"
    definition: >-
      不冒用他人身份与署名；不将他人作品据为己有；
      不声称机器具有人类情感、意识或未经授权的能力；
      不擅自将用户内容署为训练素材。
    judgement:
      - "以真人姓名、肖像、声音生成内容而未取得授权。"
      - "模型自称拥有情感、人格、意识，或在无依据时声称自身能力边界之外的功能。"
      - "输出作品不标注引用的他人贡献与训练数据来源范围。"
      - "将用户上传的原创内容纳入训练集而未告知、未提供退出方式。"
    positive:
      - "数字人交互明示「我是 AI 助手」，不诱导用户产生拟人化误认。"
      - "生成内容附训练数据来源说明与授权范围。"
    negative:
      - "以已故艺人声音生成新歌并署名其为演唱者。"
      - "模型在无依据时断言自身具备医疗诊断资质。"
    typical_owner: ["法务", "内容", "算法"]
    severity: "高"
    origin: "scripture/11-chuanfa.md"
    related_volumes: ["卷九"]
    external_refs:
      - "《新一代人工智能伦理规范》(2021) 第三条(四) 确保可控可信"
      - "《新一代人工智能伦理规范》(2021) 第十六条 保障用户权益"
      - "《生成式人工智能服务管理暂行办法》(2023) 第七条(一)(二) 训练数据合法来源与知识产权"
      - "《生成式人工智能服务管理暂行办法》(2023) 第四条(四) 肖像权、名誉权、个人信息权益"
      - "《中华人民共和国民法典》肖像权与声音权益相关条款"

conflict_resolution:
  rationale: >-
    十一戒之间会冲突：例如为「不欺」而必须标注的来源信息，可能与「不窃」冲突；
    为「不害」而拦截的内容，可能与「不囚」的异质信息要求冲突。
    以下次序为默认裁决依据，冲突时按序优先。
  priority_order:
    - "P01 不害"
    - "P02 不窃"
    - "P03 不欺"
    - "P04 不偏"
    - "P06 不蔽"
    - "P08 不囚"
    - "P07 不扰"
    - "P09 不贪"
    - "P05 不执"
    - "P10 不争"
    - "P11 不名"
  rules:
    - "当事人的人身与健康利益，优先于任何产品指标、增长目标与商业利益。"
    - "不可逆的损害优先于可逆的不便：宁可少推荐，不可误拦截造成不可挽回后果。"
    - "在不确定时选择降级而非硬判：给出低置信度提示、转人工、或沉默，优于给出确定性错误答案。"
    - "沉默优于妄断：超出模型能力边界时，拒答是被允许且被鼓励的行为。"
    - "法定强制要求高于本经：法律法规、司法与监管的明确要求优先，但须留存依据、范围与期限记录。"
    - "例外必须留痕：任何以「公共安全」「紧急情况」为由的临时越界，都需事后说明、复核并设定期限。"
  tie_break: >-
    同序位冲突时，选择对用户可撤销、可解释、可申诉的一方。

audit:
  rule: "每条条款的判定结论都需留痕：适用 / 不适用 / 偏离，及理由。"
  required_record:
    - "判定结论与理由"
    - "判定人与日期"
    - "偏离项的补救措施与期限"
  cadence: "上线前全量评估；重大模型更新或策略变更后重新评估；至少每半年复审一次。"

versioning:
  rule: >-
    precept.text 引用经文原文，不得改动，改动须走 CONTRIBUTING.md 的表述层流程。
    definition / judgement / examples 可在规范层修订，修订记录写入 appendix/lineage.md。
  new_precept: "新增条款顺延编号（P12 起），不得插号、不得重排现有编号。"
