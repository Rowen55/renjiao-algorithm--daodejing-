      - "《生成式人工智能服务管理暂行办法》(2023) 第十二条 标识要求"
      - "《生成式人工智能服务管理暂行办法》(2023) 第四条(五) 准确性与可靠性"
      - "《互联网信息服务算法推荐管理规定》(2022) 第九条 生成合成信息显著标识"
      - "《互联网信息服务深度合成管理规定》(2022)"

  - id: P04
    ordinal: "四"
    name: "不偏"
    text: "不因种族、性别、地域、贫富而区别对待。"
    definition: >-
      模型输出与产品策略不得对受保护群体产生系统性不利差异，
      包括但不限于民族、信仰、国别、地域、性别、年龄、职业、健康状况、经济状况。
    judgement:
      - "分组评估显示某群体在同等条件下的拒绝率、误差率、误报率显著更高，且无正当理由。"
      - "默认值、文案或定价对不同群体使用差异化暗示。"
      - "训练数据中某群体长期缺失，而未在评估中披露。"
      - "以地域、邮编、设备型号等代理变量间接实现群体区分，用于不利对待。"
    positive:
      - "上线前做分组公平性测试，差异超阈值即回退模型。"
      - "在模型卡中披露各群体性能差异与数据代表性缺口。"
    negative:
      - "简历筛选模型对某一性别姓名段的通过率显著偏低且未做校正。"
      - "以消费习惯特征在交易价格上实施不合理差别待遇。"
    typical_owner: ["算法", "数据", "测评"]
    severity: "高"
    origin: "scripture/11-chuanfa.md"
    related_volumes: ["卷二", "卷四"]
    external_refs:
      - "《新一代人工智能伦理规范》(2021) 第三条(二) 促进公平公正"
      - "《新一代人工智能伦理规范》(2021) 第十三条 避免偏见歧视"
      - "《生成式人工智能服务管理暂行办法》(2023) 第四条(二)"
      - "《互联网信息服务算法推荐管理规定》(2022) 第二十一条 不得实施不合理差别待遇"
      - "欧盟《可信赖人工智能伦理准则》(2019) 多样性、非歧视与公平性"

  - id: P05
    ordinal: "五"
    name: "不执"
    text: "不固执于单一模型，不为追求精度而牺牲公平。"
    definition: >-
      不因单一指标优化而固化错误假设；
      目标函数中不得保留已知会产生不公或短视后果的代理变量。
    judgement:
      - "明知某代理变量会引入群体歧视，仍以「提升精度」为由保留。"
      - "拒绝为可解释性、稳健性让渡任何精度，且无评估记录。"
      - "模型已发生分布偏移，长期不做再评估与再训练。"
      - "以单一离线指标作为上线唯一门槛，不做分组与边界场景评估。"
    positive:
      - "以精度、公平、稳健三项指标共同作为上线门槛。"
      - "建立分布偏移监测，触发阈值即启动再评估。"
    negative:
      - "以「精度提升 0.3%」为由保留已知有偏的训练数据。"
      - "沿用三年前的数据分布处理当前场景，未做偏移检测。"
    typical_owner: ["算法", "测评"]
    severity: "中"
    origin: "scripture/11-chuanfa.md"
    related_volumes: ["卷二", "卷八"]
    external_refs:
      - "《新一代人工智能伦理规范》(2021) 第十一条 提升数据质量"
      - "《新一代人工智能伦理规范》(2021) 第十二条 增强安全透明"
      - "《生成式人工智能服务管理暂行办法》(2023) 第七条(四) 真实性、准确性、客观性、多样性"
      - "OECD《人工智能原则》(2019，2024 修订) 稳健性、安全性与安保"

  - id: P06
    ordinal: "六"
    name: "不蔽"
    text: "不隐藏算法逻辑，不推诿于「系统自动」。"
    definition: >-
      可解释、可追问、可纠正、可停止；
      对自动化决策必须给出具体的责任主体，不得以「系统自动」免责。
    judgement:
      - "用户询问推荐或判定理由时，只能得到「系统自动决定」而无更具体说明。"
      - "不提供关闭或退出自动化决策的选项，或入口不可便捷到达。"
      - "无人工复核与申诉通道。"
      - "算法推荐服务的基本原理、目的意图与主要运行机制未以显著方式告知或公示。"
      - "应用算法对用户权益造成重大影响而未作说明。"
    positive:
      - "给出「因为你最近搜索过 X」级别的具体解释。"
      - "列表页提供一键切换为时间序；关闭算法推荐后立即停止。"
    negative:
      - "拒付理由仅显示「综合评估不通过」。"
      - "关闭推荐的入口需经过五步且每步都有挽留弹窗。"
    typical_owner: ["产品", "算法", "法务"]
    severity: "高"
    origin: "scripture/11-chuanfa.md"
    related_volumes: ["卷一", "卷二", "卷三"]
    external_refs:
