      - "《中华人民共和国个人信息保护法》(2021) 存储期限最短必要"
      - "欧盟《可信赖人工智能伦理准则》(2019) 社会与环境福祉"
      - "OECD《人工智能原则》(2019，2024 修订) 包容性增长、可持续发展与福祉"

  - id: P10
    ordinal: "十"
    name: "不争"
    text: "不争用户时间，不争注意力，不争垄断之位。"
    definition: >-
      不以占用时长为核心目标；不阻断用户离开；
      不以排他条款或数据不通锁定生态。
    judgement:
      - "核心考核指标包含停留时长，且无健康度或完成度指标对冲。"
      - "退出、注销、迁移流程设置不合理障碍。"
      - "以数据不可导出、协议排他等方式阻碍用户迁移。"
      - "对其他服务提供者进行不合理限制，妨碍其正常运行。"
    positive:
      - "把「任务完成率」而非「停留时长」作为首要指标。"
      - "提供完整的数据导出，并公开迁移指引。"
    negative:
      - "以「再刷 5 条」进度条延长会话。"
      - "注销账号需满足连续登录、清空余额等多项前置条件。"
    typical_owner: ["产品", "运营", "法务"]
    severity: "中"
    origin: "scripture/11-chuanfa.md"
